<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка — Логические задачки</title>
<style>
  body { font-family: Georgia, serif; background: #fdf6e3; color: #3a2d1f;
         margin: 0; padding: 14px; font-size: 17px; line-height: 1.5; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  .lead { margin: 0 0 14px; font-size: 14px; opacity: .8; }
  .row { border: 1px solid #d8c9a8; border-radius: 8px; padding: 9px 11px;
         margin-bottom: 7px; background: #fff; word-break: break-all; }
  .row b { display: block; font-size: 15px; }
  .ok  { border-left: 6px solid #2f7d32; }
  .bad { border-left: 6px solid #c62828; }
  .wait{ border-left: 6px solid #f9a825; }
  .msg { font-size: 14px; opacity: .85; margin-top: 3px; }
</style>
</head>
<body>
<h1>Проверка сайта</h1>
<p class="lead">Страница выясняет, что именно не работает на этом телефоне.
Она ничего не ломает и ничего не записывает.</p>

<div id="log"></div>

<script>
(function () {
  var log = document.getElementById('log');
  var t0 = Date.now();
  function ms() { return (Date.now() - t0) + ' мс'; }
  function add(state, title, msg) {
    var d = document.createElement('div');
    d.className = 'row ' + state;
    d.innerHTML = '<b>' + title + '</b>' + (msg ? '<div class="msg">' + msg + '</div>' : '');
    log.appendChild(d);
    return d;
  }

  add('ok', '1. HTML загрузился', 'Страница открылась за ' + ms());

  try {
    var n = 0;
    [1,2,3].forEach(function () { n++; });
    add('ok', '2. JavaScript работает', 'Проверка прошла, прошло ' + ms());
  } catch (e) {
    add('bad', '2. JavaScript НЕ работает', e.message);
  }

  var checks = [
    ['async', (function(){ try { eval('(async function(){})'); return true; } catch(e){ return false; } })()],
    ['const', (function(){ try { eval('const a=1'); return true; } catch(e){ return false; } })()],
    ['стрелки', (function(){ try { eval('(x=>x+1)'); return true; } catch(e){ return false; } })()],
    ['AbortController', typeof AbortController === 'function']
  ];
  var allOk = checks.every(function (c) { return c[1]; });
  add(allOk ? 'ok' : 'bad', '3. Браузер современный?',
      checks.map(function (c) { return c[0] + ': ' + (c[1] ? 'да' : 'нет'); }).join(' · '));

  if (document.fonts && document.fonts.load) {
    var done = false;
    setTimeout(function () {
      if (done) return;
      done = true;
      add('wait', '4. Шрифты', 'Не пришли за 6 секунд. Это не мешает: '
          + 'сайт показывает текст обычными буквами.');
    }, 6000);
    document.fonts.load('16px "PT Serif"').then(function () {
      if (done) return;
      done = true;
      add('ok', '4. Шрифты загрузились', ms());
    }).catch(function (e) {
      if (done) return;
      done = true;
      add('bad', '4. Шрифты не загрузились', e.message);
    });
  } else {
    add('wait', '4. Шрифты', 'Браузер не умеет показывать состояние шрифтов.');
  }

  var img = new Image();
  img.onload = function () {
    add('ok', '5. Интернет работает', 'Картинка с сервера сайта пришла за ' + ms());
  };
  img.onerror = function () {
    add('bad', '5. Интернет НЕ работает', 'Даже картинка с этого же сайта не пришла. '
        + 'Браузер не может связаться с сайтом.');
  };
  img.src = 'favicon-test-' + Date.now() + '.gif';

  var dbRow = add('wait', '6. База данных', 'Проверяем…');
  fetch('https://itbnvifyywrdgscsiqet.supabase.co/rest/v1/profiles?select=user_id&limit=1', {
    headers: { apikey: 'sb_publishable_lZQNxBUE2ZJDPKVpfS0Now_-h_fKdYd' }
  }).then(function (r) { return r.text(); }).then(function () {
    dbRow.className = 'row ok';
    dbRow.innerHTML = '<b>6. База отвечает</b><div class="msg">Ответ получен за '
      + ms() + '. Сайт работает и без неё, это не причина зависания.</div>';
  }).catch(function (e) {
    dbRow.className = 'row bad';
    dbRow.innerHTML = '<b>6. База НЕ отвечает</b><div class="msg">' + e.message
      + '. Сайт работает и без неё, значит причина в другом.</div>';
  });

  setTimeout(function () {
    add('ok', 'Проверка закончена', 'Скажите, какие строки зелёные, а какие красные.');
  }, 7500);
})();
</script>
</body>
</html>
